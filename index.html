<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>预期波阻抗调节</title>
<style>
:root{--bg:#f4f4f2;--surface:#fff;--text:#1a1a1a;--muted:#666;--border:#ddd;--accent:#c2410c;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px}
input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;margin-top:14px;cursor:pointer}
.dev{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.dev:active{background:#f7f7f5}
.dev b{font-size:18px}
.dev .tag{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.dev p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.warn{color:#b91c1c;font-weight:700}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
#gate .box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;width:min(320px,90vw)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="gate"><div class="box"><h1>预期波阻抗调节</h1><p class="sub">输入密码后进入</p><input id="pw" type="password" placeholder="密码" autocomplete="off" /><button class="btn" onclick="unlock()">进入</button><p id="pwerr" class="warn hidden">密码不对，再试一次</p></div></div>
<div class="wrap hidden" id="app">
<h1>预期波阻抗调节</h1>
<p class="sub">三台设备各用各的数据，互不干扰。选一台进入，只记这一个网址就行。</p>
<a class="dev" href="yuqibo.html"><b>1号设备</b><span class="tag">交流</span><p>LR-1.5/0.7 交流调节负载<br>AC 220V~726V，电流 0.1~1.5kA，三相</p></a>
<a class="dev" href="yuqibo2.html"><b>2号设备</b><span class="tag">交流</span><p>LR-0.125/0.7 交流调节负载<br>AC 220V~726V，电流 1~125A，三相</p></a>
<a class="dev" href="yuqibo3.html"><b>3号设备</b><span class="tag">直流</span><p>ZLR-0.125/1.5 直流调节负载<br>DC 60V~1500V，电流 1~125A，时间常数 2~15ms</p></a>
</div>
<script>
const PW_HASH='a21d84d80fcab9ec08db16e87339c08bc4db7aec15b08a37650ced4ac2cd866a';
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function enter(){
  sessionStorage.setItem('yuqibo_ok','1');
  sessionStorage.setItem('yuqibo2_ok','1');
  sessionStorage.setItem('yuqibo3_ok','1');
  const g=document.getElementById('gate'); if(g) g.remove();
  document.getElementById('app').classList.remove('hidden');
}
async function unlock(){
  const v=document.getElementById('pw').value;
  if(await sha256(v)===PW_HASH){ enter(); }
  else document.getElementById('pwerr').classList.remove('hidden');
}
if(sessionStorage.getItem('yuqibo_ok')==='1'||sessionStorage.getItem('yuqibo2_ok')==='1'||sessionStorage.getItem('yuqibo3_ok')==='1'){ enter(); }
</script>
</body>
</html>
